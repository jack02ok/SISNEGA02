<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="100%" height="100%">
  <defs>
    <!-- Sky Gradient -->
    <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#cbd5e1"/>
      <stop offset="50%" stop-color="#e2e8f0"/>
      <stop offset="100%" stop-color="#f1f5f9"/>
    </linearGradient>

    <!-- Roof Gradient -->
    <linearGradient id="roofGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#881337"/>
      <stop offset="30%" stop-color="#7c2d12"/>
      <stop offset="70%" stop-color="#581c87"/>
      <stop offset="100%" stop-color="#3b0764"/>
    </linearGradient>

    <!-- Wall Paint Gradients -->
    <linearGradient id="whiteWall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f8fafc"/>
    </linearGradient>
    <linearGradient id="greenPaint" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#16a34a"/>
      <stop offset="100%" stop-color="#15803d"/>
    </linearGradient>
    <linearGradient id="pillarGreen" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22c55e"/>
      <stop offset="60%" stop-color="#16a34a"/>
      <stop offset="100%" stop-color="#14532d"/>
    </linearGradient>

    <!-- Ground / Paving -->
    <linearGradient id="groundGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#64748b"/>
      <stop offset="50%" stop-color="#475569"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>
  </defs>

  <!-- Sky Background -->
  <rect width="1200" height="900" fill="url(#skyGrad)"/>

  <!-- Ground Paving -->
  <path d="M 0 640 L 1200 640 L 1200 900 L 0 900 Z" fill="url(#groundGrad)"/>
  <g stroke="#334155" stroke-width="1" opacity="0.3">
    <line x1="0" y1="690" x2="1200" y2="690"/>
    <line x1="0" y1="750" x2="1200" y2="750"/>
    <line x1="0" y1="820" x2="1200" y2="820"/>
  </g>

  <!-- Main School Building (SD NEGERI NEGLASARI 02 Perspective) -->
  <!-- Upper White Wall Structure -->
  <polygon points="100,320 1150,420 1150,650 100,650" fill="url(#whiteWall)"/>

  <!-- Lower Green Painted Band -->
  <polygon points="100,520 1150,550 1150,650 100,650" fill="url(#greenPaint)"/>
  <line x1="100" y1="520" x2="1150" y2="550" stroke="#14532d" stroke-width="4"/>

  <!-- Roof Structure with Eaves -->
  <polygon points="40,310 1180,410 1100,160 180,160" fill="url(#roofGrad)"/>
  <polygon points="30,310 1190,410 1190,330 30,330" fill="#451a03"/>

  <!-- Pillars along the Veranda Walkway -->
  <rect x="610" y="420" width="28" height="230" fill="url(#pillarGreen)"/>
  <rect x="800" y="435" width="28" height="215" fill="url(#pillarGreen)"/>
  <rect x="980" y="450" width="28" height="200" fill="url(#pillarGreen)"/>

  <!-- Wooden Door (Middle Veranda) -->
  <rect x="650" y="470" width="48" height="180" fill="#78350f" stroke="#451a03" stroke-width="2"/>
  <rect x="655" y="475" width="38" height="85" fill="#9a3412" opacity="0.7"/>

  <!-- Windows with Dark Frames -->
  <rect x="710" y="470" width="70" height="110" fill="#1e293b" stroke="#0f172a" stroke-width="2"/>
  <line x1="745" y1="470" x2="745" y2="580" stroke="#cbd5e1" stroke-width="1.5"/>
  <line x1="710" y1="525" x2="780" y2="525" stroke="#cbd5e1" stroke-width="1.5"/>

  <rect x="840" y="480" width="70" height="105" fill="#1e293b" stroke="#0f172a" stroke-width="2"/>
  <line x1="875" y1="480" x2="875" y2="585" stroke="#cbd5e1" stroke-width="1.5"/>
  <line x1="840" y1="532" x2="910" y2="532" stroke="#cbd5e1" stroke-width="1.5"/>

  <!-- "BERSIH YES.." Signboard -->
  <rect x="680" y="405" width="85" height="32" fill="#ffffff" stroke="#1e293b" stroke-width="1.5" rx="2"/>
  <text x="722" y="426" font-family="'Segoe UI', Roboto, sans-serif" font-weight="bold" font-size="12" fill="#0f172a" text-anchor="middle">BERSIH YES..</text>

  <!-- Large Black Glass School Name Board on Left Wall -->
  <rect x="200" y="310" width="280" height="190" fill="#020617" stroke="#d97706" stroke-width="4" rx="2"/>
  <!-- Grid Lines on Glass Panel -->
  <line x1="200" y1="360" x2="480" y2="360" stroke="#334155" stroke-width="1"/>
  <line x1="200" y1="410" x2="480" y2="410" stroke="#334155" stroke-width="1"/>
  <line x1="200" y1="460" x2="480" y2="460" stroke="#334155" stroke-width="1"/>
  <line x1="290" y1="310" x2="290" y2="500" stroke="#334155" stroke-width="1"/>
  <line x1="380" y1="310" x2="380" y2="500" stroke="#334155" stroke-width="1"/>

  <text x="340" y="375" font-family="'Impact', 'Arial Black', sans-serif" font-weight="900" font-size="24" fill="#ffffff" text-anchor="middle" letter-spacing="1">SDN NEGLASARI 02</text>
  <text x="340" y="445" font-family="sans-serif" font-weight="bold" font-size="11" fill="#94a3b8" text-anchor="middle">JL. KH TUBAGUS ASIK</text>

  <!-- Blue Hardonas Banner: "SELAMAT HARI PENDIDIKAN NASIONAL" -->
  <rect x="230" y="500" width="220" height="105" fill="#0f172a" stroke="#eab308" stroke-width="2" rx="3"/>
  <rect x="230" y="500" width="220" height="24" fill="#1d4ed8" rx="1"/>
  <text x="340" y="516" font-family="sans-serif" font-weight="bold" font-size="10" fill="#ffffff" text-anchor="middle">SELAMAT HARI PENDIDIKAN NASIONAL</text>
  <text x="340" y="530" font-family="sans-serif" font-size="9" fill="#93c5fd" text-anchor="middle">TAHUN 2021</text>
  <text x="340" y="548" font-family="sans-serif" font-weight="bold" font-size="10" fill="#fef08a" text-anchor="middle">"SERENTAK BERGERAK,</text>
  <text x="340" y="563" font-family="sans-serif" font-weight="bold" font-size="10" fill="#ffffff" text-anchor="middle">WUJUDKAN MERDEKA BELAJAR"</text>
  <text x="340" y="588" font-family="sans-serif" font-weight="extrabold" font-size="11" fill="#facc15" text-anchor="middle">SD NEGERI NEGLASARI 02</text>

  <!-- Concrete Bench Front -->
  <rect x="120" y="615" width="480" height="35" fill="#cbd5e1" stroke="#64748b" stroke-width="2" rx="2"/>

  <!-- Lush Dark Green Jackfruit / Mango Tree Leaves Overhead & Left Framing (Matching uploaded photo) -->
  <g fill="#14532d">
    <ellipse cx="120" cy="80" rx="220" ry="140" />
    <ellipse cx="280" cy="120" rx="180" ry="110" fill="#15803d" />
    <ellipse cx="80" cy="220" rx="150" ry="120" />
    <ellipse cx="220" cy="220" rx="140" ry="100" fill="#166534" />
    
    <!-- Top Overhead Tree Canopy -->
    <ellipse cx="650" cy="40" rx="280" ry="90" fill="#14532d"/>
    <ellipse cx="920" cy="60" rx="220" ry="100" fill="#15803d"/>
  </g>

  <!-- Right Tree Trunk & Bush (Matching uploaded photo right side) -->
  <path d="M 1120 200 L 1180 200 L 1200 700 L 1100 700 Z" fill="#3f2314"/>
  <ellipse cx="1100" cy="280" rx="160" ry="180" fill="#14532d"/>
  <ellipse cx="1020" cy="360" rx="120" ry="140" fill="#15803d"/>

  <!-- Right Bush Bottom Foreground -->
  <ellipse cx="980" cy="780" rx="220" ry="120" fill="#15803d"/>
  <ellipse cx="1020" cy="760" rx="180" ry="100" fill="#22c55e"/>

  <!-- Light Vignette -->
  <rect width="1200" height="900" fill="none" stroke="#020617" stroke-width="12" opacity="0.15"/>
</svg>
